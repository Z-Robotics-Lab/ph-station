<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>组件实验室 · Component Lab（非控制台）</title>
    <style>
      /* Lab chrome only — every color rides the imported ui-theme tokens so
         light/dark and the ?theme= knob need no styles of their own here. */
      #root { display: flex; flex-direction: column; height: 100%;
        color: var(--dsw-alias-label-primary, #0f1115); }

      /* Header: PH mark + title on one side, controls on the other. The amber
         top strip is the lab's anti-confusion marker — the console has none. */
      header.lab-header { flex: none; display: flex; align-items: center;
        gap: 16px; padding: 10px 18px; background: var(--dsw-alias-bg-layer-1, #fff);
        border-top: 3px solid var(--dsw-alias-state-warn-primary, #f59e0b);
        border-bottom: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1)); }
      .lab-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .lab-mark { flex: none; width: 30px; height: 30px; border-radius: 8px;
        display: grid; place-items: center; font-size: 12px; font-weight: 800;
        letter-spacing: .04em; color: #fff;
        background: var(--dsw-alias-state-business-primary, #3b82f6);
        box-shadow: 0 1px 2px rgba(0,0,0,.18) inset, 0 1px 3px rgba(0,0,0,.18); }
      .lab-title { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
      .lab-title b { font-size: 15px; font-weight: 700; }
      .lab-title small { font-size: 11px; color: var(--dsw-alias-label-tertiary, #888);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lab-tag { flex: none; align-self: center; padding: 2px 8px; border-radius: 999px;
        font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
        color: var(--dsw-alias-state-warn-primary, #f59e0b);
        border: 1px solid color-mix(in srgb, var(--dsw-alias-state-warn-primary) 45%, transparent);
        background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 12%, transparent); }
      .lab-console-link { display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
        text-decoration: none; white-space: nowrap;
        color: var(--dsw-alias-label-primary-inverted, #fff);
        background: var(--dsw-alias-state-business-primary, #3b82f6);
        transition: filter var(--ds-transition-duration-fast, .1s); }
      .lab-console-link:hover { filter: brightness(1.12); }

      /* Controls: segmented light/dark, latency, locale + a refresh button. */
      .lab-controls { margin-left: auto; display: flex; align-items: center;
        gap: 14px; flex-wrap: wrap; }
      .lab-seg { display: flex; align-items: center; gap: 6px; }
      .lab-seg-label { font-size: 11px; color: var(--dsw-alias-label-tertiary, #888); }
      .lab-seg-track { display: inline-flex; padding: 2px; border-radius: 8px;
        background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent);
        border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1)); }
      .lab-seg-track button { appearance: none; border: 0; background: none; cursor: pointer;
        padding: 3px 9px; border-radius: 6px; font-size: 11px; line-height: 1.4;
        color: var(--dsw-alias-label-secondary, #555);
        transition: background var(--ds-transition-duration-fast, .1s),
          color var(--ds-transition-duration-fast, .1s); }
      .lab-seg-track button:hover { color: var(--dsw-alias-label-primary, #111); }
      .lab-seg-track button.is-on { color: var(--dsw-alias-label-primary-inverted, #fff);
        background: var(--dsw-alias-state-business-primary, #3b82f6); }
      .lab-refresh { appearance: none; cursor: pointer; font-size: 11px;
        display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
        border-radius: 8px; color: var(--dsw-alias-label-secondary, #555);
        background: none; border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1));
        transition: background var(--ds-transition-duration-fast, .1s); }
      .lab-refresh:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(0,0,0,.05)); }

      /* Tab rail: pill tabs with a vendored tabler icon + underline on active. */
      nav.scratch.lab-tabs { flex: none; display: flex; gap: 2px; padding: 6px 12px 0;
        overflow-x: auto; background: var(--dsw-alias-bg-layer-1, #fff);
        border-bottom: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1)); }
      nav.scratch.lab-tabs a { display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 11px 9px; font-size: 12.5px; white-space: nowrap; text-decoration: none;
        border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 7px 7px 0 0;
        color: var(--dsw-alias-label-secondary, #555);
        transition: background var(--ds-transition-duration-fast, .1s),
          color var(--ds-transition-duration-fast, .1s); }
      nav.scratch.lab-tabs a svg { flex: none; opacity: .85; }
      nav.scratch.lab-tabs a:hover { color: var(--dsw-alias-label-primary, #111);
        background: var(--dsw-alias-interactive-bg-hover, rgba(0,0,0,.05)); }
      nav.scratch.lab-tabs a.is-active { color: var(--dsw-alias-state-business-primary, #3b82f6);
        border-bottom-color: var(--dsw-alias-state-business-primary, #3b82f6); font-weight: 600; }
      nav.scratch.lab-tabs a.is-active svg { opacity: 1; }

      /* Stage: framed card floating on a faintly tinted app background. */
      main.scratch.lab-stage { flex: 1; min-height: 0; display: flex; padding: 16px;
        overflow: hidden;
        background: color-mix(in srgb, var(--dsw-alias-label-primary) 4%, var(--dsw-alias-bg-base, #fff)); }
      .lab-card { flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden;
        background: var(--dsw-alias-bg-layer-1, #fff);
        border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1)); border-radius: 12px;
        box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 28px -16px rgba(0,0,0,.22); }
      .lab-card > * { flex: 1; min-width: 0; min-height: 0; }
      main.scratch.lab-stage.rail { justify-content: center; }
      main.scratch.lab-stage.rail .lab-card { flex: 0 0 340px; max-width: 340px; }

      /* Fixture placeholders (dash harness): honest mock surfaces, badged. */
      .lab-fixture-note { margin: auto; max-width: 30rem; padding: 18px 20px;
        border: 1px dashed var(--dsw-alias-border-l2, rgba(0,0,0,.1)); border-radius: 10px;
        background: color-mix(in srgb, var(--dsw-alias-label-primary) 3%, transparent);
        font-size: 13px; line-height: 1.7; color: var(--dsw-alias-label-secondary, #555); }
      .lab-badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px;
        font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
        color: var(--dsw-alias-state-business-primary, #3b82f6);
        background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 14%, transparent); }
      .lab-chip-tag { font-size: 10px; color: var(--dsw-alias-label-tertiary, #888); align-self: center; }
      .lab-chip { padding: 3px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap;
        color: var(--dsw-alias-label-secondary, #555);
        border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.12));
        background: color-mix(in srgb, var(--dsw-alias-label-primary) 4%, transparent); }
      .lab-composer { height: 44px; resize: none; width: 100%; box-sizing: border-box;
        border-radius: 8px; padding: 6px 10px; font-size: 12px;
        color: var(--dsw-alias-label-primary, #111);
        background: var(--dsw-alias-bg-base, #fff);
        border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.12)); }

      /* Footer: one honest line about what this rig is. */
      footer.lab-footer { flex: none; padding: 7px 18px; font-size: 11px;
        color: var(--dsw-alias-label-tertiary, #888);
        border-top: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1));
        background: var(--dsw-alias-bg-layer-1, #fff);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      footer.lab-footer a { color: inherit; }

      /* Dark: the console's depth model — near-black chrome and canvas
         (bg-base, 950), cards one step lighter (bg-layer-1, 875), hairline
         borders, a faint brand vignette on the canvas. The light-mode stage
         formula (4% label tint) would LIGHTEN the canvas here — label-primary
         flips to near-white in dark — washing out the card frame, and black
         drop shadows carry no depth on a dark ground. */
      body[data-ds-dark-theme] header.lab-header,
      body[data-ds-dark-theme] nav.scratch.lab-tabs,
      body[data-ds-dark-theme] footer.lab-footer {
        background: var(--dsw-alias-bg-base);
        border-bottom-color: var(--dsw-alias-border-l2-darkmode-thin, rgba(255,255,255,.06)); }
      body[data-ds-dark-theme] footer.lab-footer {
        border-top-color: var(--dsw-alias-border-l2-darkmode-thin, rgba(255,255,255,.06)); }
      body[data-ds-dark-theme] main.scratch.lab-stage {
        background:
          radial-gradient(120% 70% at 50% 0%, rgba(86, 134, 254, .05), transparent 55%),
          var(--dsw-alias-bg-base); }
      body[data-ds-dark-theme] .lab-card {
        background: var(--dsw-alias-bg-layer-1);
        border-color: var(--dsw-alias-border-l2-darkmode-thin, rgba(255,255,255,.06));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04),
          0 16px 40px -20px rgba(0, 0, 0, .8); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
