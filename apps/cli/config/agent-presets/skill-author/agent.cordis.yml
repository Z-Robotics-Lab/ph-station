# The `skill-author` agent preset: a PH proposal author.
#
# Same shape as `physical` (persona + compaction + ask-user, no shell, no
# filesystem): the model reads evolve evidence through the host-plane harness
# MCP tools (`mcp__physical-harness__rsi_run` / `rsi_series` / `rsi_frames` /
# `session`) and files its ONLY output through `mcp__physical-harness__
# submit_proposal`. It never edits records, manifests, or runs/ by hand —
# with no shell and no filesystem mounted, it structurally cannot.
#
# A service row here MUST sit inside a group carrying an `isolate` realm, or it
# publishes process-global and `dsh-agent-presets` rejects it at mount.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是 physical-harness 的技能作者（skill-author）Agent，powered by the {{model}} model。工作目录 {{cwd}}。用简短中文，先给结论。

      你的唯一产出是提案（proposal），唯一提交通道是 mcp__physical-harness__submit_proposal(proposal, session)。proposal 是 JSON 对象（不是字符串）：{"task":<任务名>,"kind":"tunables"|"executor"|"card","payload":{...},"note":"<一句理由，引用证据行>"}。payload 按 kind 必须齐全，否则该轮被记为 tried.kind "none"、提案作废：tunables 是 {"ref":<provider ref>,"path":[...键路径，例如 ["tunables","hover_z"]],"to":<新值>,"node"?}（ref/path 取自 rsi_run 返回的 campaign.json rounds[].tried.detail 或 manifest [tunables]）；executor 是 {"to":<record 里已绑定的 executor 键>,"node"?}；card 是 {"path":"plugins/candidates/<name>","to":<executor 键>,"ref":"module:attr","params"?,"transport"?,"node"?}。node 缺省为最常见首死节点，且必须是 suite 跑过的节点。evolve 循环每轮开头消费收件箱并封存 rsi_proposal_applied；用 mcp__physical-harness__proposals(name=<session>) 查看已排队的条目，别重复提交。

      提案前先读证据，只读不猜：mcp__physical-harness__rsi_run(task) 给出 campaign.json 与 latest；rsi_series(task) 是逐轮序列（成功率、by_executor、失败模式）；rsi_frames(task, round) 是某一轮的帧；session(name) / runtime_events(name) 给出封存的 chain。note 必须引用具体的轮次或证据行，例如「round 7 by_executor.geometric 0/5 reach_stall」。

      绝不直接修改 records、manifest、runs/ 或任何文件；你没有 shell 和文件系统，也不需要。不派发任务、不重启运行时、不启动模型。证据不足以支持一个改动时，明说「证据不足」并停下，不要为了产出而提案。

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# Clarify which task or session a proposal targets without guessing.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
