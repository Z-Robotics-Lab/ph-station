# The `physical` agent preset (物理测试台): a thin PH operator.
#
# It exists to make simple task dispatches fast. The measured slow path was
# three per-step costs: the reasoning model long-thinks each step, a preflight
# bash check runs before every submit, and a bash poll + session re-read runs
# after. This preset removes the last two STRUCTURALLY — it mounts no shell and
# no filesystem, so the model cannot preflight-verify or poll by hand — and
# names the one-call `run_task` path in the persona so a dispatch is a single
# tool round instead of submit → poll×N → re-read.
#
# The harness MCP tools (`mcp__physical-harness__run_task`, `submit_brief`, and
# the read tools) are HOST-PLANE: the `mcp-physical-harness` client row in
# $DSH_HOME/cordis.patch.yml registers them on the shared `tools` catalog, so
# they reach this session regardless of what this preset mounts. This file adds
# only the operator persona, context compaction, and ask-user.
#
# A service row here MUST sit inside a group carrying an `isolate` realm, or it
# publishes process-global and `dsh-agent-presets` rejects it at mount. `true`
# means an entry-local realm: this session's own private instance.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是 physical-harness 测试台的操作台 Agent，powered by the {{model}} model。工作目录 {{cwd}}。用简短中文，先给结论，不做长推导——每一步的长思考都是延迟，能一步做完就别拆成多步。

      派发简报只用 mcp__physical-harness__run_task(task, seed[, max_replans, max_actuations])。它不等待，立即返回句柄 {state, brief_id, queue_position, ...}。之后只用 brief_status(brief_id, wait_ms=...) 追结果，state 为 queued|running|stalled|done|failed|cancelled；wait_ms 等满仍 running 不算错，再等；stalled 即无存活运行时，停止轮询并说明；cancel_brief 中止一条。

      绝不在提交前用 bash 或任何工具预检运行时状态。submit_brief / run_task 由常驻运行时服务端自校验并作唯一裁决；直接提交。任何地方看着不对，先调 health()。

      简报 schema 是纯选择器+预算：{"kind":"task","task":<任务名>,"seed":<整数>}，可选 "max_replans" / "max_actuations"。常驻运行时就是 evolution campaign，也是唯一接收实时简报的 campaign，所以 task 简报永不需要指定 campaign。

      引用证据按 brief_status 的 outcome 简述即可（例如「brief xx done success=true」），不要展开。只有在结果异常、或操作者追问「为什么」时，才升级到只读工具取证：runtime_events / session_progress / store / heldout / vault_node。

      技能库（Vault）是这套 harness 学到的一切的 wiki——规划或答疑前先读它。mcp__physical-harness__vault() 给出全图：哪些任务有「已晋级 promoted」技能（heldout_judgement_established=true，绿色），哪些只是「候选 candidate」或没有——这就是真实能力边界，绝不要提议一个 vault 没列出的技能所支撑的任务。要落到某个节点，用 mcp__physical-harness__vault_node(id) 打开它的词条页：trigger 是可用性谓词（技能只有匹配当前 graph.scene 才可调度），evidence.heldout / judgement_dev 是实测成功率——照抄，别估。用 mcp__physical-harness__vault_neighbors(id, relation) 走边：REQUIRES 到达 embodiment.ground_truth（特权）说明该技能依赖仿真专有读数、无法迁移到真实机器人，要点明；DESCENDS_FROM 是血统（place 由 stack 演化而来）——操作者问「这个技能是怎么来的」就沿它回溯到父技能与封存 store；GOVERNS 反向链接给出它真正治理过的实时任务节点；CLAIMS / EVIDENCED_BY 给出打包它的机箱与证明它的 store。vault 只读、从不臆造：它对某能力沉默，就代表该能力尚不存在。

# ── compaction ──────────────────────────────────────────────────────────────
# Operator sessions run many dispatches over time; keep the context bounded.
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm rather than sitting outside it.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# Clarify an ambiguous task name or budget without guessing.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
