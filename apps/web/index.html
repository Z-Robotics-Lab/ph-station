<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>physical-harness 控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // crypto.randomUUID exists only in secure contexts; lab operators reach
      // the console over plain-http LAN forwards, where getRandomValues still
      // works. RFC 4122 v4 built from getRandomValues bytes.
      if (!('randomUUID' in crypto)) {
        crypto.randomUUID = function () {
          const b = crypto.getRandomValues(new Uint8Array(16))
          b[6] = (b[6] & 0x0f) | 0x40
          b[8] = (b[8] & 0x3f) | 0x80
          const h = Array.from(b, (x) => x.toString(16).padStart(2, '0'))
          return `${h.slice(0, 4).join('')}-${h.slice(4, 6).join('')}-${h.slice(6, 8).join('')}-${h.slice(8, 10).join('')}-${h.slice(10).join('')}`
        }
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
